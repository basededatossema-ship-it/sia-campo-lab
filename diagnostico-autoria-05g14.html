
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">
<title>SIA - Diagnóstico de autoría</title>
<style>
body {
  font-family: system-ui, sans-serif;
  padding: 20px;
  color: #153E37;
  background: #F3F7F5;
}
pre {
  background: white;
  padding: 18px;
  border-radius: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>

<h2>SIA - Verificación de autoría</h2>
<p>Etapa 05G.14C · Solo lectura local</p>
<pre id="resultado">Consultando borrador...</pre>

<script>
"use strict";

const UUID =
  "7fbb0fcf-bf30-4e3b-ac18-80fab5b0b002";

const salida = document.getElementById(
  "resultado"
);

const solicitud = indexedDB.open(
  "SIA_CAMPO_PWA_LAB", 1
);

solicitud.onupgradeneeded = () => {
  solicitud.transaction.abort();
};

solicitud.onerror = () => {
  salida.textContent =
    "BASE_LOCAL_NO_DISPONIBLE";
};

solicitud.onsuccess = () => {
  const db = solicitud.result;

  if (!db.objectStoreNames.contains("borradores")) {
    salida.textContent =
      "ALMACEN_NO_DISPONIBLE";
    db.close();
    return;
  }

  const tx = db.transaction(
    "borradores", "readonly"
  );

  const consulta = tx.objectStore(
    "borradores"
  ).get(UUID);

  consulta.onsuccess = () => {
    const registro = consulta.result;

    if (!registro) {
      salida.textContent =
        "BORRADOR_NO_ENCONTRADO";
      return;
    }

    const autor = registro.autoriaInstitucional;

    salida.textContent = JSON.stringify({
      uuid: registro.id,
      estado: registro.estado,
      responsable: registro.responsable || "",
      usuarioId: autor?.usuarioId || "",
      nombreCompleto: autor?.nombreCompleto || "",
      modulo: autor?.modulo || "",
      autoriaRegistrada:
        !!autor?.usuarioId &&
        !!autor?.nombreCompleto &&
        registro.responsable ===
          autor.nombreCompleto
    }, null, 2);
  };

  consulta.onerror = () => {
    salida.textContent =
      "LECTURA_LOCAL_FALLIDA";
  };

  tx.oncomplete = () => db.close();

  tx.onabort = () => {
    salida.textContent =
      "CONSULTA_CANCELADA";
    db.close();
  };
};
</script>
</body>
</html>
