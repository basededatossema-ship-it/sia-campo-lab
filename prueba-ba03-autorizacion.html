
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">

  <title>SIA — Autorización BA-03.G.5.4</title>

  <script
    src="https://accounts.google.com/gsi/client"
    async defer>
  </script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f3f7f4;
      color: #193e32;
      padding: 24px;
    }

    main {
      max-width: 480px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
    }

    #googleButton {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    #estado {
      padding: 16px;
      background: #e9f0eb;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

<main>
  <h2>SIA — Bienestar Animal</h2>

  <h3>BA-03.G.5.4</h3>

  <p>
    Validación de autorización institucional
    de envío mediante Google.
  </p>

  <p>
    Esta prueba no envía formularios
    ni escribe registros.
  </p>

  <div id="googleButton"></div>

  <div id="estado"
       role="status"
       aria-live="polite">
    Preparando autenticación...
  </div>
</main>

<script>
"use strict";

const CLIENT_ID =
  "539376159794-mp0qjge29fhkudf2tdp9cu8knfq3qhlv.apps.googleusercontent.com";

const ENDPOINT =
  "https://script.google.com/macros/s/" +
  "AKfycbx8xZx31rH7LERYaSrwv6NzdNHjVKP0-" +
  "AH_y6WZGSrp3IeOekC6JbgEFx-K4S0Ywg77/exec";

const estado =
  document.getElementById("estado");

let ocupado = false;

async function verificar(respuestaGoogle) {

  if (ocupado) return;

  const idToken =
    respuestaGoogle &&
    respuestaGoogle.credential;

  if (
    typeof idToken !== "string" ||
    !idToken
  ) {
    estado.textContent =
      "BA03G54_CREDENCIAL_NO_RECIBIDA";
    return;
  }

  ocupado = true;

  estado.textContent =
    "Verificando autorización institucional...";

  const controlador = new AbortController();

  const limite = setTimeout(
    () => controlador.abort(),
    15000
  );

  try {

    const respuesta = await fetch(ENDPOINT, {
      method: "POST",
      credentials: "omit",
      redirect: "follow",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify({
        operacion: "AUTORIZAR_ENVIO_BANIMAPP",
        idToken: idToken
      }),
      signal: controlador.signal
    });

    if (!respuesta.ok) {
      throw new Error("HTTP_NO_DISPONIBLE");
    }

    const datos = await respuesta.json();

    const contratoValido = Boolean(
      datos &&
      datos.contrato ===
        "SIA-BA03-AUTORIZACION-01" &&
      datos.modulo === "BIENESTAR_ANIMAL" &&
      datos.accion === "ENVIAR_REGISTROS"
    );

    if (!contratoValido) {
      estado.textContent =
        "BA03G54_CONTRATO_INCOMPATIBLE";
      return;
    }

    const autorizado = Boolean(
      datos.ok === true &&
      datos.permitido === true &&
      datos.motivo === "AUTORIZADO" &&
      typeof datos.usuarioId === "string" &&
      datos.usuarioId.trim() &&
      typeof datos.idUsuarioBA === "string" &&
      datos.idUsuarioBA.trim()
    );

    if (autorizado) {
      estado.textContent =
        "BA03G54_AUTORIZACION_POSITIVA_VALIDADA";
      return;
    }

    if (
      datos.ok === false &&
      datos.permitido === false
    ) {
      estado.textContent =
        "BA03G54_AUTORIZACION_DENEGADA";
      return;
    }

    estado.textContent =
      "BA03G54_RESPUESTA_INCONSISTENTE";

  } catch (_) {

    estado.textContent =
      "BA03G54_CONSULTA_NO_COMPLETADA";

  } finally {
    clearTimeout(limite);
    ocupado = false;
  }
}

function iniciarGoogle() {

  if (
    !window.google ||
    !google.accounts ||
    !google.accounts.id
  ) {
    estado.textContent =
      "BA03G54_GOOGLE_NO_DISPONIBLE";
    return;
  }

  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: verificar,
    auto_select: false
  });

  google.accounts.id.renderButton(
    document.getElementById("googleButton"),
    {
      theme: "outline",
      size: "large",
      text: "signin_with",
      width: 250
    }
  );

  estado.textContent =
    "Selecciona tu cuenta institucional.";
}

window.addEventListener(
  "load",
  iniciarGoogle
);
</script>

</body>
</html>
