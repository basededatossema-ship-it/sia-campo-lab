
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>SIA — Diagnóstico BA-03</title>
  <script
    src="https://accounts.google.com/gsi/client"
    async defer>
  </script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f3f7f4;
      color: #193e32;
      padding: 24px;
    }
    main {
      max-width: 480px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
    }
    #googleButton {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }
    #estado {
      padding: 16px;
      background: #e9f0eb;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h2>SIA — Prueba BA-03.B.5</h2>
  <p>
    Verificación institucional de autorización
    de envío. No transmite registros.
  </p>

  <div id="googleButton"></div>
  <div id="estado" role="status"
       aria-live="polite">
    Preparando autenticación...
  </div>
</main>

<script>
"use strict";

const CLIENT_ID =
  "539376159794-mp0qjge29fhkudf2tdp9cu8knfq3qhlv.apps.googleusercontent.com";

const ENDPOINT =
  "https://script.google.com/macros/s/AKfycbx8xZx31rH7LERYaSrwv6NzdNHjVKP0-AH_y6WZGSrp3IeOekC6JbgEFx-K4S0Ywg77/exec";

const estado = document.getElementById("estado");
let ocupado = false;

async function verificar(respuestaGoogle) {
  if (ocupado) return;

  const idToken = respuestaGoogle?.credential;

  if (typeof idToken !== "string" || !idToken) {
    estado.textContent =
      "Google no entregó una credencial.";
    return;
  }

  ocupado = true;
  estado.textContent =
    "Consultando autorización institucional...";

  const controlador = new AbortController();
  const limite = setTimeout(
    () => controlador.abort(), 12000
  );

  try {
    const respuesta = await fetch(ENDPOINT, {
      method: "POST",
      credentials: "omit",
      redirect: "follow",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify({
        operacion: "AUTORIZAR_ENVIO_BANIMAPP",
        idToken: idToken
      }),
      signal: controlador.signal
    });

    if (!respuesta.ok) {
      throw new Error("HTTP_NO_DISPONIBLE");
    }

    const datos = await respuesta.json();

    if (
      datos.contrato !==
        "SIA-BA03-AUTORIZACION-01" ||
      datos.modulo !== "BIENESTAR_ANIMAL" ||
      datos.accion !== "ENVIAR_REGISTROS"
    ) {
      estado.textContent =
        "BA03: RESPUESTA_INCOMPATIBLE";
      return;
    }

    if (
      datos.ok === false &&
      datos.permitido === false &&
      datos.motivo === "ENVIO_NO_AUTORIZADO"
    ) {
      estado.textContent =
        "BA03: PERMISO_DESACTIVADO_CONFIRMADO";
      return;
    }

    if (
      datos.ok === true &&
      datos.permitido === true
    ) {
      estado.textContent =
        "BA03: AUTORIZACION_INESPERADA";
      return;
    }

    const motivosPermitidos = [
      "ACCESO_NO_AUTORIZADO",
      "CONSULTA_RECHAZADA",
      "VINCULACION_INVALIDA",
      "USUARIO_NO_VINCULADO",
      "PERMISO_NO_DISPONIBLE",
      "PERMISO_VENCIDO",
      "IDENTIDAD_NO_VERIFICADA"
    ];

    estado.textContent =
      "BA03: " + (
        motivosPermitidos.includes(datos.motivo)
          ? datos.motivo
          : "RECHAZO_NO_CLASIFICADO"
      );

  } catch (_) {
    estado.textContent =
      "BA03: CONSULTA_HTTP_NO_COMPLETADA";
  } finally {
    clearTimeout(limite);
    ocupado = false;
  }
}

function iniciarGoogle() {
  if (!window.google?.accounts?.id) {
    estado.textContent =
      "No se pudo inicializar Google.";
    return;
  }

  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: verificar,
    auto_select: false
  });

  google.accounts.id.renderButton(
    document.getElementById("googleButton"),
    {
      theme: "outline",
      size: "large",
      text: "signin_with",
      width: 250
    }
  );

  estado.textContent =
    "Selecciona tu cuenta institucional.";
}

window.addEventListener("load", iniciarGoogle);
</script>
</body>
</html>
